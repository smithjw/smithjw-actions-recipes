Description: |
  Downloads the latest GitHub CLI (gh) universal installer pkg from GitHub
  Releases (cli/cli) and verifies the signed universal gh binary inside it.

  The vendor ships a true universal pkg (gh_<version>_macOS_universal.pkg)
  containing a single arm64 + x86_64 binary installed to /usr/local/bin/gh, so
  no per-architecture handling is needed. The pkg wrapper itself is unsigned, so
  the trust boundary is the code signature on the gh binary unpacked from its
  payload (Team ID VEKTX9H2N7).
Identifier: com.github.smithjw-actions.download.GitHub_CLI
MinimumVersion: '2.9'

Input:
  NAME: GitHub CLI
  SOFTWARE_TITLE: GitHub_CLI
  INCLUDE_PRERELEASES: null
  DOWNLOAD_MISSING_FILE: 'True'
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      asset_regex: '^gh_.*_macOS_universal\.pkg$'
      github_repo: cli/cli
      include_prereleases: '%INCLUDE_PRERELEASES%'

  - Processor: com.github.smithjw-actions.processors/URLDownloaderPython
    Arguments:
      download_missing_file: '%DOWNLOAD_MISSING_FILE%'
      filename: '%SOFTWARE_TITLE%.pkg'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: '%RECIPE_CACHE_DIR%/downloads/unpack'
      flat_pkg_path: '%pathname%'
      purge_destination: true

  - Processor: FileFinder
    Arguments:
      pattern: '%RECIPE_CACHE_DIR%/downloads/unpack/*.pkg/Payload'

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: '%RECIPE_CACHE_DIR%/downloads/payload'
      purge_destination: true
      pkg_payload_path: '%found_filename%'

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%RECIPE_CACHE_DIR%/downloads/payload/usr/local/bin/gh'
      requirement: identifier "gh" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "VEKTX9H2N7"
      strict_verification: true

  - Processor: com.github.smithjw.processors/FriendlyPathDeleter
    Arguments:
      fail_deleter_silently: true
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads/unpack'
        - '%RECIPE_CACHE_DIR%/downloads/payload'
