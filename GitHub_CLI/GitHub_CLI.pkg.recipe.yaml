Description: |
  Renames the vendor's universal GitHub CLI installer to
  GitHub_CLI-<version>.pkg for upload.

  The upstream pkg already installs a universal gh binary to /usr/local/bin/gh,
  so no repackaging is needed — the download recipe verifies the binary's code
  signature and this recipe simply copies the pkg to the expected name.
Identifier: com.github.smithjw-actions.pkg.GitHub_CLI
ParentRecipe: com.github.smithjw-actions.download.GitHub_CLI
MinimumVersion: '2.9'

Input:
  NAME: GitHub CLI
  SOFTWARE_TITLE: GitHub_CLI

Process:
  - Processor: PkgCopier
    Arguments:
      pkg_path: '%RECIPE_CACHE_DIR%/%SOFTWARE_TITLE%-%version%.pkg'
      source_pkg: '%pathname%'
